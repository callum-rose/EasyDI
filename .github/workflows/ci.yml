name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    env:
      # EasyDI.Tests targets net9.0 while global.json pins the .NET 10 SDK.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test EasyDI.Tests/EasyDI.Tests.csproj -c Release

  vendored-dlls:
    name: Unity vendored DLLs match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Rebuild and vendor
        run: ./scripts/vendor-unity-dlls.sh

      # The Unity package ships prebuilt DLLs, so a change to core that isn't re-vendored
      # leaves Unity consumers on stale code. The vendor build is byte-reproducible
      # (see the flags in the script), so any diff here means someone forgot to re-run it.
      - name: Check for drift
        run: |
          if ! git diff --exit-code -- EasyDI.Unity/Assets/EasyDI.Unity/Runtime/Plugins/; then
            echo
            echo "::error::The vendored Unity DLLs are out of date with the source."
            echo "Run ./scripts/vendor-unity-dlls.sh locally and commit the result."
            exit 1
          fi
