name: Publish to nuget.org

# Manual only. Publishing is irreversible — a version can be unlisted but never deleted,
# and never reused — so this deliberately doesn't fire on push or on tags.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Requires a GitHub environment named "release". Give it required reviewers so a
    # publish needs an explicit approval click. If you also enter "release" in the
    # nuget.org policy's Environment field, a workflow run outside this environment
    # can't get a key at all.
    environment: release

    permissions:
      id-token: write # lets the job request the OIDC token trusted publishing exchanges
      contents: write # lets the final step push the release tags

    steps:
      # Full history, for the tag step at the end. The default shallow fetch brings down no
      # tags, so tag-release.sh would see every version as untagged and then fail pushing one
      # that already exists — turning a re-run after a partial release into an error.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GeneratePackageOnBuild is on, so a plain build produces every .nupkg and its
      # .snupkg. `dotnet pack` does NOT work in this repo — it races the build and
      # fails with NU5019/NU5026.
      - name: Build packages
        run: dotnet build -c Release

      # Deliberately after the build: the temporary key lasts one hour, so it's issued
      # as late as possible.
      - name: Exchange OIDC token for a short-lived API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push EasyDI
        run: >
          dotnet nuget push EasyDI/bin/Release/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      # Everything else depends on EasyDI, so it goes up first.
      - name: Push the dependent packages
        run: |
          for project in EasyDI.Analyzers EasyDI.LifecycleHooks EasyDI.Configuration EasyDI.Godot.Core; do
            dotnet nuget push "$project"/bin/Release/*.nupkg \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done

      # Last, and only if every push succeeded: a tag is a claim that this commit is what's
      # on nuget.org, so it must not exist for a release that failed halfway. Versions already
      # tagged are left alone, which is what makes a re-run after a partial failure safe.
      - name: Tag the released versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/tag-release.sh --push
